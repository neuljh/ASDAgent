[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asdagent"
version = "0.1.0"
description = "Strategy-aware dual-agent framework for autism intervention dialogue synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ASDAgent Authors" }
]
dependencies = [
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=1.10.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
embedding = ["torch>=2.0.0", "transformers>=4.40.0"]

[tool.setuptools.packages.find]
where = ["src"]
